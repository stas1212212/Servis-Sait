name: Customer service quality checks
on:
  push:
    branches:
      - feature/customer-service-suite-20261013
  pull_request:
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify JavaScript syntax
        run: find server -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Exercise customer-service API with mocked persistence
        run: node --test tests/*.test.js
