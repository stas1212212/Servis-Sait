<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Оформлення замовлення | PULT+</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css?v=20261108-final">
    <link rel="stylesheet" href="css/cart-modal.css?v=20261108">

  <script src="/js/theme.js"></script>
</head>

<body class="bg-gray-50 text-gray-900">

<div id="header"></div>

<main>

<section class="pt-40 pb-20">

    <div class="max-w-7xl mx-auto px-6">

        <div class="mb-16">

            <span class="inline-block px-5 py-2 rounded-full bg-black text-white mb-6">

                PULT+

            </span>

            <h1 class="text-5xl font-black">

                Оформлення замовлення

            </h1>

        </div>

        <div class="grid lg:grid-cols-[1fr_380px] gap-14">

            <!-- FORM -->

            <div>

                <div class="checkout-card">

                    <h2>

                        Контактні дані

                    </h2>

                    <form id="checkoutForm" class="v1-checkout-form">
                        <div class="v1-checkout-pair">
                          <label>Ваше ім'я
                            <input type="text" name="customer_name" required autocomplete="name" minlength="2" maxlength="120" placeholder="Ім'я та прізвище">
                          </label>
                          <label>Контактний телефон
                            <input type="tel" name="customer_phone" required autocomplete="tel" maxlength="30" placeholder="+380...">
                          </label>
                        </div>
                        <label>Email для зв'язку (необов'язково)
                          <input type="email" name="customer_email" maxlength="254" autocomplete="email" placeholder="example@email.com">
                        </label>
                        <label>Як ви хочете отримати товар?
                          <select id="checkoutDeliveryMethod" name="delivery_method" required>
                            <option value="nova_poshta">Нова пошта</option>
                            <option value="ukrposhta">Укрпошта</option>
                            <option value="discuss">Узгодити доставку з менеджером</option>
                          </select>
                        </label>
                        <div id="checkoutDeliveryDetails">
                          <div class="v1-checkout-pair">
                            <label>Місто
                              <input type="text" name="delivery_city" maxlength="120" autocomplete="address-level2" required placeholder="Місто отримання">
                            </label>
                            <label>Відділення / поштовий індекс
                              <input type="text" name="delivery_branch" maxlength="180" required placeholder="№ відділення або індекс">
                            </label>
                          </div>
                        </div>
                        <label>Коментар до замовлення (необов'язково)
                          <textarea name="customer_comment" maxlength="1000" placeholder="Уточнення щодо товару, доставки або зв'язку" rows="4"></textarea>
                        </label>
                        <p class="v1-checkout-notice">Після замовлення менеджер PULT+ підтвердить наявність товару, вартість доставки, спосіб оплати та подальші кроки. Карткову оплату цей сайт поки не приймає. <a href="/privacy.html" target="_blank" rel="noopener noreferrer">Як ми обробляємо персональні дані</a>.</p>
                        <p id="checkoutStatus" role="status" aria-live="polite" class="v1-checkout-status"></p>
                    </form>

                </div>

            </div>
                        <!-- SUMMARY -->

            <aside>

                <div class="checkout-summary">

                    <h2>

                        Ваше замовлення

                    </h2>

                    <div id="checkoutItems">

                        <!-- JS -->

                    </div>

                    <div class="summary-line">

                        <span>

                            Товарів

                        </span>

                        <span id="checkoutCount">

                            0

                        </span>

                    </div>

                    <div class="summary-line">

                        <span>

                            До сплати

                        </span>

                        <span id="checkoutTotal">

                            0₴

                        </span>

                    </div>

                    <button
                        form="checkoutForm"
                        class="checkout-button" type="submit">

                        Підтвердити замовлення

                    </button>

                </div>

            </aside>

        </div>

    </div>

</section>

</main>

<div id="footer"></div>

<!-- JS -->

<script src="js/dropdown.js"></script>
<script src="js/burger.js"></script>

<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
<script src="js/main.js"></script>

</body>

</html>
