<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Доставка ремонту | PULT+</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/experience.css"><link rel="stylesheet" href="/css/shipping.css">
<script src="https://cdn.tailwindcss.com"></script><script src="/js/theme.js"></script>
</head>
<body><div id="header"></div>
<main class="exp-main"><div class="exp-container">
<section class="exp-hero"><p class="ship-eyebrow" data-shipping-i18n="client.eyebrow">PULT+ · НОВА ПОШТА</p><h1 data-shipping-i18n="client.title">Доставка моєї техніки</h1>
<p data-shipping-i18n="client.subtitle">Вкажіть вхідну ТТН, оберіть відділення для повернення та відстежуйте обидва відправлення.</p></section>
<p class="ship-intro" data-shipping-i18n="client.notice">Не надсилайте пристрій до підтвердження реквізитів для вашої заявки.</p>
<p id="shippingStatus" role="status" aria-live="polite" data-shipping-i18n="client.loading">Завантажуємо заявки…</p>
<div id="shippingList" class="ship-list"></div>
<p class="exp-muted" style="margin-top:25px"><span data-shipping-i18n="client.guest">Заявку подано без входу? Зв’яжіться з менеджером.</span> <a href="/track.html" data-shipping-i18n="client.repairCodeLink">Код заявки RP-…</a>.</p>
</div></main><div id="footer"></div>
<script src="/js/dropdown.js"></script><script src="/js/burger.js"></script><script src="/js/cart.js"></script><script src="/js/main.js"></script><script src="/js/shipping-i18n.js"></script><script src="/js/shipping-client.js"></script>
</body></html>
