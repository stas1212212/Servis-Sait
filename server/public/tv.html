<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ремонт телевізорів | PULT+</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="header">

    <div class="container header-container">

        <a href="index.html" class="logo">

            <div class="logo-title">

                PULT+

            </div>

            <div class="logo-subtitle">

                Сервісний центр

            </div>

        </a>

        <nav class="navigation">

            <a href="index.html">Головна</a>
            <a href="#">Послуги</a>
            <a href="#">Контакти</a>

        </nav>

        <div class="header-right">

            <button class="header-button">

                Контакти

            </button>

            <button class="header-button">

                UA

            </button>

            <a href="#repairForm" class="request-button">

                Заявка

            </a>

        </div>

    </div>

</header>

<main>

<section class="hero">

    <div class="container hero-container">

        <div class="hero-text">

            <span class="hero-icon">

                📺

            </span>

            <h1>

                Ремонт телевізорів

            </h1>

            <p>

                Виконуємо професійний ремонт телевізорів Samsung, LG,
                Sony, Philips, TCL, Hisense та інших брендів.
                Заміна підсвітки, ремонт материнських плат,
                блоків живлення та Smart TV.

            </p>

            <a href="#repairForm" class="hero-button">

                Оформити заявку

            </a>

        </div>

    </div>

</section>

<section class="tv-section">

<div class="container tv-layout">

<div class="tv-preview">

<div class="preview-card">

<img
id="tvImage"
src="https://images.samsung.com/is/image/samsung/p6pim/uk/ue55du7100uxua/gallery/uk-uhd-du7100-ue55du7100uxua-thumb-540910329?$344_344_PNG$"
alt="Телевізор">

</div>

<h2 id="brandTitle">

Samsung

</h2>

<div class="brand-selector">

<button
class="brand active"
data-brand="Samsung"
data-image="https://images.samsung.com/is/image/samsung/p6pim/uk/ue55du7100uxua/gallery/uk-uhd-du7100-ue55du7100uxua-thumb-540910329?$344_344_PNG$">

Samsung

</button>

<button
class="brand"
data-brand="LG"
data-image="https://www.lg.com/content/dam/channel/wcms/ua/images/tvs/oled55c46la_arub_eu_ua_c/gallery/DZ-01.jpg">

LG

</button>

<button
class="brand"
data-brand="Sony"
data-image="https://sony.scene7.com/is/image/sonyglobalsolutions/primary-image?$productPreset$">

Sony

</button>

<button
class="brand"
data-brand="Philips"
data-image="https://images.philips.com/is/image/philipsconsumer/">

Philips

</button>

<button
class="brand"
data-brand="TCL"
data-image="https://www.tcl.com/content/dam/tcl/product/tv">

TCL

</button>

<button
class="brand"
data-brand="Hisense"
data-image="https://assets.hisense.com/is/image/hisense">

Hisense

</button>

<button
class="brand"
data-brand="Інший"
data-image="https://cdn-icons-png.flaticon.com/512/1041/1041916.png">

Інший

</button>

</div>

</div>

<div class="repair-form-card" id="repairForm">

<h2>

Анкета ремонту

</h2>

<form id="tvRepairForm">

<div class="input-group">

<label>

Ваше ім'я

</label>

<input
type="text"
name="name"
placeholder="Введіть ім'я"
required>

</div>

<div class="input-group">

<label>

Телефон

</label>

<input
type="tel"
name="phone"
placeholder="+380..."
required>

</div>

<div class="input-group">

<label>

Email

</label>

<input
type="email"
name="email"
placeholder="mail@example.com">

</div>

<div class="input-group">

<label>

Бренд телевізора

</label>

<input
id="selectedBrand"
type="text"
value="Samsung"
readonly>

</div>

<div class="input-group">

<label>

Модель телевізора

</label>

<input
type="text"
name="model"
placeholder="UE55DU7100">

</div>

<div class="input-group">

<label>

Тип телевізора

</label>

<select name="type">

<option>LED</option>
<option>QLED</option>
<option>OLED</option>
<option>NanoCell</option>
<option>Mini LED</option>
<option>Smart TV</option>
<option>Не знаю</option>

</select>

</div>

<div class="input-group">

<label>

Яка несправність?

</label>

<textarea
rows="4"
name="problem"
placeholder="Не вмикається, немає зображення, звук є, екран чорний..."></textarea>

</div>
</main>

<script src="js/device.js"></script>

</body>
/html>
