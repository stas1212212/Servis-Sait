<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новий пароль | PULT+</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/experience.css">
<script src="/js/theme.js"></script></head>
<body><div id="header"></div>
<main class="exp-main"><div class="exp-container">
<section class="exp-hero"><h1>Створити новий пароль</h1><p>Надійно збережіть новий пароль. Посилання можна використати тільки один раз.</p></section>
<section class="exp-grid"><div class="exp-card"><form id="resetForm"><label>Новий пароль<input name="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" required></label><label>Повторити пароль<input name="confirm" type="password" minlength="10" maxlength="72" autocomplete="new-password" required></label><button type="submit">Змінити пароль</button><p id="resetResult" role="status" aria-live="polite"></p></form><p id="afterReset" hidden><a class="exp-button" href="/login.html">Увійти</a></p></div></section>
</div></main><div id="footer"></div>
<script src="/js/dropdown.js"></script><script src="/js/burger.js"></script>
<script src="/js/cart.js"></script><script src="/js/main.js"></script>

</body></html>
