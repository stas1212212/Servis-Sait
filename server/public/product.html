<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PULT+</title>

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Styles -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
<link rel="stylesheet" href="/css/store-product.css">
    <link rel="stylesheet" href="css/cart-modal.css">

  <script src="/js/theme.js"></script>
</head>

<body class="bg-gray-50 text-gray-900">

<!-- HEADER -->

<div id="header"></div>

<main>

<!-- ========================= -->
<!-- Product -->
<!-- ========================= -->

<section class="pt-40 pb-24">
    <div class="max-w-7xl mx-auto px-6 store-product-page-toolbar"><a href="/pults-shop.html" data-store-i18n="product.back">← До каталогу</a><p id="productError" role="status" aria-live="polite"></p></div>

    <div class="max-w-7xl mx-auto px-6">

        <div class="grid lg:grid-cols-2 gap-20 items-start">

            <!-- IMAGE -->

            <div class="product-image">

                <img
                    id="productImage"
                    src=""
                    alt="">

            </div>

            <!-- INFO -->

            <div>

                <span
                    id="productBrand"
                    class="inline-block px-4 py-2 rounded-full bg-black text-white mb-6">

                </span>

                <h1
                    id="productTitle"
                    class="text-5xl font-black mb-6">

                </h1>

                <div
                    id="productRating"
                    class="text-2xl mb-8">

                </div>

                <div
                    id="productPrice"
                    class="text-5xl font-black mb-10">

                </div>

                <p
                    id="productDescription"
                    class="text-lg text-gray-600 leading-8 mb-10">

                </p>

                <p id="productStock" class="store-detail-stock" role="status"></p>
                <p id="productCategory" class="store-detail-category"></p>
                <div class="flex flex-wrap gap-5">

                    <button class="buy-btn" type="button" disabled data-store-i18n="product.buy">

                        Купити

                    </button>

                    <a href="/contacts.html" class="telegram-btn" data-store-i18n="product.contactLink">Контакти</a>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- ========================= -->
<!-- Characteristics -->
<!-- ========================= -->

<section class="pb-24">

    <div class="max-w-7xl mx-auto px-6">

        <div class="grid lg:grid-cols-2 gap-12">

            <div class="info-card">

                <h2 data-store-i18n="product.features">Характеристики</h2>

                <ul id="productFeatures">

                </ul>

            </div>

            <div class="info-card">

                <h2 data-store-i18n="product.compatible">Сумісність / призначення</h2>

                <ul id="productCompatible">

                </ul>

            </div>

        </div>

    </div>

</section>
<!-- ========================= -->
<!-- Description -->
<!-- ========================= -->

<section class="pb-24">

    <div class="max-w-5xl mx-auto px-6">

        <div class="description-card">

            <h2 data-store-i18n="product.description">Опис</h2>

            <p id="productDescriptionLong">

                Детальний опис товару буде автоматично
                завантажений із бази даних.

            </p>

        </div>

    </div>

</section>

<!-- ========================= -->
<!-- CTA -->
<!-- ========================= -->

<section class="pb-24">

    <div class="max-w-5xl mx-auto px-6">

        <div class="cta-product"><h2 data-store-i18n="product.contact">Потрібна допомога з вибором?</h2>
<p data-store-i18n="product.contactText">Зв’яжіться з нами, щоб уточнити характеристики та сумісність товару.</p>
<a href="/contacts.html" data-store-i18n="product.contactLink">Контакти</a>

        </div>

    </div>

</section>

</main>

<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<div id="footer"></div>

<!-- ========================= -->
<!-- JS -->
<!-- ========================= -->
 
<script src="js/dropdown.js"></script>
<script src="js/burger.js"></script>


<script src="js/cart-modal.js"></script>
<script src="js/cart.js"></script>
<script src="/js/catalog-i18n.js"></script>
<script src="js/product.js"></script>

<script src="js/main.js"></script>

</body>

</html>
