<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PULT+</title>

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Styles -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">

</head>

<body class="bg-gray-50 text-gray-900">

<!-- HEADER -->

<div id="header"></div>

<main>

<!-- ========================= -->
<!-- Product -->
<!-- ========================= -->

<section class="pt-40 pb-24">

    <div class="max-w-7xl mx-auto px-6">

        <div class="grid lg:grid-cols-2 gap-20 items-start">

            <!-- IMAGE -->

            <div class="product-image">

                <img
                    id="productImage"
                    src=""
                    alt="">

            </div>

            <!-- INFO -->

            <div>

                <span
                    id="productBrand"
                    class="inline-block px-4 py-2 rounded-full bg-black text-white mb-6">

                </span>

                <h1
                    id="productTitle"
                    class="text-5xl font-black mb-6">

                </h1>

                <div
                    id="productRating"
                    class="text-2xl mb-8">

                </div>

                <div
                    id="productPrice"
                    class="text-5xl font-black mb-10">

                </div>

                <p
                    id="productDescription"
                    class="text-lg text-gray-600 leading-8 mb-10">

                </p>

                <div class="flex flex-wrap gap-5">

                    <button class="buy-btn">

                        Купити

                    </button>

                    <a
                        href="https://t.me/"
                        class="telegram-btn">

                        Telegram

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- ========================= -->
<!-- Characteristics -->
<!-- ========================= -->

<section class="pb-24">

    <div class="max-w-7xl mx-auto px-6">

        <div class="grid lg:grid-cols-2 gap-12">

            <div class="info-card">

                <h2>

                    Характеристики

                </h2>

                <ul id="productFeatures">

                </ul>

            </div>

            <div class="info-card">

                <h2>

                    Сумісність

                </h2>

                <ul id="productCompatible">

                </ul>

            </div>

        </div>

    </div>

</section>
<!-- ========================= -->
<!-- Description -->
<!-- ========================= -->

<section class="pb-24">

    <div class="max-w-5xl mx-auto px-6">

        <div class="description-card">

            <h2>

                Опис

            </h2>

            <p id="productDescriptionLong">

                Детальний опис товару буде автоматично
                завантажений із бази даних.

            </p>

        </div>

    </div>

</section>

<!-- ========================= -->
<!-- CTA -->
<!-- ========================= -->

<section class="pb-24">

    <div class="max-w-5xl mx-auto px-6">

        <div class="cta-product">

            <h2>

                Не впевнені, що це саме ваш пульт?

            </h2>

            <p>

                Надішліть модель телевізора або іншої техніки —
                ми швидко підберемо потрібний варіант.

            </p>

            <a href="https://t.me/">

                Написати в Telegram

            </a>

        </div>

    </div>

</section>

</main>

<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<div id="footer"></div>

<!-- ========================= -->
<!-- JS -->
<!-- ========================= -->

<script src="js/dropdown.js"></script>
<script src="js/burger.js"></script>
<script src="js/theme.js"></script>
<script src="js/product.js"></script>
<script src="js/cart.js"></script>
<!-- Основной -->
<script src="js/main.js"></script>

</body>

</html>
