<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Адміністрування | PULT+</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div id="header"></div>
<main class="admin-page">
<div class="admin-container">
<header class="admin-heading"><div><p>PULT+ SERVICE CENTER</p><h1>Панель адміністратора</h1><span>Керування ремонтом і замовленнями магазину</span></div><a href="/cabinet.html">Особистий кабінет →</a></header>
<p style="margin:0 0 24px"><a class="admin-save" href="/admin-hub.html">🔔 Повідомлення · Контакти · Відгуки →</a></p>
<p style="margin:0 0 24px"><a class="admin-save" href="/admin-shipping.html">🚚 Нова пошта: ТТН · приймання · повернення →</a></p>
<div id="adminMessage" role="status" aria-live="polite">Перевіряємо доступ...</div>
<section id="adminWorkspace" hidden>
<div class="admin-summary"><article><span>Усього заявок</span><strong id="adminTotal">0</strong></article><article><span>Нові</span><strong id="adminPending">0</strong></article><article><span>У роботі</span><strong id="adminProgress">0</strong></article><article><span>Завершені</span><strong id="adminDone">0</strong></article></div>
<nav class="admin-tabs" aria-label="Розділи адміністратора"><button type="button" id="adminRepairsTab" class="active" aria-pressed="true">Заявки на ремонт</button><button type="button" id="adminOrdersTab" aria-pressed="false">Замовлення товарів</button><button type="button" id="adminProductsTab" aria-pressed="false">Товари</button></nav>
<div id="adminRepairsPanel"><div class="admin-toolbar"><label for="adminSearch">Пошук заявки</label><input id="adminSearch" type="search" placeholder="Номер, клієнт, телефон або пристрій"><button id="adminRefresh" type="button">Оновити</button></div>
<div id="adminRequests" class="admin-requests"></div></div>
<div id="adminOrdersPanel" hidden><div class="admin-toolbar"><label for="adminOrdersSearch">Пошук замовлення</label><input id="adminOrdersSearch" type="search" placeholder="Номер, клієнт або товар"><button id="adminOrdersRefresh" type="button">Оновити</button></div><div id="adminOrdersList" class="admin-requests"></div></div>
<div id="adminProductsPanel" hidden><div class="admin-toolbar"><label for="adminProductsSearch">Пошук товару</label><input id="adminProductsSearch" type="search" placeholder="Назва, бренд, SKU"><button type="button" id="adminProductsNew">+ Додати товар</button></div><div id="adminProductsList" class="admin-requests"></div><form id="adminProductForm" class="admin-product-form" hidden><h2 id="adminProductFormTitle">Редагувати товар</h2><div class="admin-product-fields"><label>SKU<input name="sku" maxlength="80" required></label><label>Назва<input name="name" maxlength="200" required></label><label>Бренд<input name="brand" maxlength="100"></label><label>Модель<input name="model" maxlength="150"></label><label>Ціна (грн)<input name="price" type="number" min="0" max="10000000" step="0.01" required></label><label>На складі<input name="stock" type="number" min="0" max="1000000" step="1" required></label><label>Категорія<select name="category" required><option value="tv">Телевізори</option><option value="universal">Універсальні</option><option value="receiver">Ресивери</option><option value="tvbox">TV Box</option><option value="ac">Кондиціонери</option><option value="audio">Аудіо</option><option value="parts">Запчастини</option></select></label><label>Шлях до фото (необов’язково)<input name="image_url" placeholder="/img/products/example.webp"></label><label class="admin-product-wide">Опис<textarea name="description" rows="3"></textarea></label><label class="admin-product-checkbox"><input name="is_active" type="checkbox" checked> Показувати в магазині</label></div><div class="admin-request-actions"><button class="admin-save" type="submit">Зберегти товар</button><button type="button" id="adminProductCancel">Скасувати</button></div></form></div></section>
</div>
</main>
<div id="footer"></div>
<script src="js/dropdown.js"></script><script src="js/burger.js"></script><script src="js/cart.js"></script><script src="js/main.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-orders.js"></script>
<script src="js/admin-products.js"></script>
</body></html>
